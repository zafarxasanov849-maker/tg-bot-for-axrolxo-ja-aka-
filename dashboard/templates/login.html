<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KPI Dashboard — Kirish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1d2e;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #F5A623;
      text-align: center;
      margin-bottom: 8px;
    }
    .sub {
      text-align: center;
      color: #8892a4;
      font-size: 0.875rem;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #8892a4;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 14px;
      color: #e2e8f0;
      font-size: 0.95rem;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #F5A623; }
    button {
      width: 100%;
      background: #F5A623;
      color: #0f1117;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
    .error {
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      color: #f87171;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.875rem;
      margin-bottom: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📊 KPI Dashboard</div>
    <div class="sub">Tizimchiman kursi</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <label>Login</label>
      <input type="text" name="username" placeholder="admin" autocomplete="username" required/>
      <label>Parol</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
      <button type="submit">Kirish</button>
    </form>
  </div>
</body>
</html>
